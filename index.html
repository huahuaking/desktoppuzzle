<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花哞的电脑</title>
<style>
/* ========== CSS Variables ========== */
:root {
  --bg-desktop: linear-gradient(135deg, #e8ecf1 0%, #d5dce6 25%, #e8d5c4 60%, #e0d6c8 100%);
  --surface: #ffffff;
  --surface-muted: #f4f4f8;
  --border: #dcdce8;
  --text: #2c2c3a;
  --text-muted: #6a6a7e;
  --text-dim: #9a9ab0;
  --brand: #7c5cff;
  --brand-soft: #efe9ff;
  --amber: #f6b73c;
  --amber-deep: #e89c1e;
  --blue: #8fb8f0;
  --blue-deep: #5a8fd4;
  --green: #7fc99a;
  --teal: #5cc9b0;
  --red: #ff6b6b;
  --shadow: 0 8px 32px rgba(40,40,80,.12);
  --shadow-lg: 0 16px 48px rgba(40,40,80,.18);
  --radius: 8px;
  --radius-card: 12px;
  --radius-full: 999px;
  --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); overflow: hidden; height: 100vh; background: #1a1a2e; user-select: none; }

/* ========== Lock Screen ========== */
#lockscreen {
  position: fixed; inset: 0; z-index: 5000;
  background: linear-gradient(160deg, #3a3d6b 0%, #5c4a7a 40%, #8a5a7a 80%, #b87a7a 100%);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; color: #fff;
  transition: opacity .5s ease, transform .5s ease;
}
#lockscreen.unlocked { opacity: 0; transform: scale(1.05); pointer-events: none; }
.lock-time {
  font-size: 72px; font-weight: 300; letter-spacing: 4px;
  text-shadow: 0 4px 20px rgba(0,0,0,.2); margin-bottom: 6px;
}
.lock-date {
  font-size: 16px; opacity: .75; margin-bottom: 40px;
  letter-spacing: 2px;
}
.lock-avatar {
  width: 96px; height: 96px; border-radius: 50%;
  background: linear-gradient(135deg, #ffd89b, #ff9a9e);
  display: flex; align-items: center; justify-content: center;
  font-size: 42px; margin-bottom: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,.15);
  border: 3px solid rgba(255,255,255,.25);
}
.lock-username-text {
  font-size: 20px; font-weight: 500; margin-bottom: 24px;
  text-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.lock-form {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  width: 280px;
}
.lock-input {
  width: 100%; padding: 12px 18px;
  background: rgba(255,255,255,.15); backdrop-filter: blur(10px);
  border: 1.5px solid rgba(255,255,255,.25); border-radius: 999px;
  color: #fff; font-size: 14px; font-family: var(--font);
  outline: none; text-align: center;
  transition: all .2s ease;
}
.lock-input::placeholder { color: rgba(255,255,255,.5); }
.lock-input:focus {
  background: rgba(255,255,255,.22);
  border-color: rgba(255,255,255,.5);
}
.lock-btn {
  padding: 10px 36px; border-radius: 999px;
  background: rgba(255,255,255,.2); backdrop-filter: blur(10px);
  border: 1.5px solid rgba(255,255,255,.3); color: #fff;
  font-size: 14px; cursor: pointer; font-family: var(--font);
  transition: all .2s ease; margin-top: 4px;
}
.lock-btn:hover {
  background: rgba(255,255,255,.32);
  transform: translateY(-1px);
}
.lock-btn:active { transform: translateY(0); }
.lock-error {
  font-size: 12px; color: #ffb8b8; min-height: 18px;
  opacity: 0; transition: opacity .2s;
}
.lock-error.show { opacity: 1; }
.lock-hint {
  position: absolute; bottom: 30px; font-size: 12px;
  color: rgba(255,255,255,.45); letter-spacing: 1px;
}

/* ========== Desktop ========== */
#desktop {
  width: 100vw; height: calc(100vh - 48px);
  background: var(--bg-desktop);
  position: relative; overflow: hidden;
}
#desktop-icons {
  position: absolute; left: 16px; top: 16px;
  display: flex; flex-direction: column; gap: 10px;
  z-index: 10;
}

/* ========== Desktop Icons ========== */
.desk-icon {
  display: flex; flex-direction: column; align-items: center;
  width: 76px; padding: 10px 6px 8px;
  border-radius: var(--radius-card);
  cursor: pointer; transition: all .15s ease;
  border: 2px solid transparent;
}
.desk-icon:hover { background: rgba(255,255,255,.55); transform: translateY(-2px); }
.desk-icon:active { transform: scale(.95); }
.desk-icon svg { display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.08)); }
.desk-icon .label {
  font-size: 11px; line-height: 14px; color: #3a3a50;
  text-align: center; margin-top: 5px; word-break: break-all;
  text-shadow: 0 1px 0 rgba(255,255,255,.5);
}
.desk-icon.hidden-file { opacity: 0; pointer-events: none; transform: scale(.8); transition: all .35s ease; }
.desk-icon.hidden-file.visible { opacity: 1; pointer-events: auto; transform: scale(1); }
.desk-icon.locked { animation: gentle-pulse 2.5s ease-in-out infinite; }
@keyframes gentle-pulse {
  0%,100% { border-color: transparent; }
  50% { border-color: var(--brand); box-shadow: 0 0 12px rgba(124,92,255,.25); }
}

/* ========== Taskbar ========== */
#taskbar {
  height: 48px; background: rgba(245,245,250,.92);
  backdrop-filter: blur(12px); border-top: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 12px; gap: 6px;
  position: relative; z-index: 1000;
}
.taskbar-item {
  height: 34px; padding: 0 14px; border-radius: 6px;
  font-size: 12px; color: var(--text); cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  background: rgba(0,0,0,.04); transition: all .15s ease;
  border: 1px solid transparent;
}
.taskbar-item:hover { background: rgba(0,0,0,.08); }
.taskbar-item.active { background: rgba(124,92,255,.12); border-color: var(--brand); }
.taskbar-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); flex-shrink: 0; }
.taskbar-hint {
  margin-left: auto; font-size: 11px; color: var(--text-muted);
  padding-right: 8px;
}

/* ========== Windows ========== */
.window {
  position: absolute; min-width: 320px; min-height: 180px; max-height: 80vh;
  background: var(--surface); border-radius: 10px;
  box-shadow: var(--shadow-lg); border: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  z-index: 100; transition: box-shadow .2s ease;
}
.window.focused { box-shadow: 0 20px 56px rgba(40,40,80,.22); z-index: 999; }
.window-titlebar {
  height: 36px; background: #f0f0f6; display: flex; align-items: center;
  padding: 0 10px; gap: 8px; cursor: grab; flex-shrink: 0;
}
.window-titlebar:active { cursor: grabbing; }
.window-dots { display: flex; gap: 6px; }
.window-dot {
  width: 11px; height: 11px; border-radius: 50%; cursor: pointer;
  transition: all .15s ease;
}
.win-close { background: #ff6b6b; }
.win-close:hover { background: #e85555; }
.win-min { background: #ffcc4d; }
.win-min:hover { background: #e8b830; }
.win-max { background: #51d88a; }
.win-max:hover { background: #3cc870; }
.window-title {
  font-size: 12px; font-weight: 600; color: #4a4a60;
  margin-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1;
}
.win-close-x {
  width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; border-radius: 4px; color: #8a8a9e;
  font-size: 14px; font-weight: 700; line-height: 1;
  transition: all .15s ease; margin-left: auto; flex-shrink: 0;
}
.win-close-x:hover { background: #e85555; color: #fff; }
.window-body {
  flex: 1; overflow: auto; padding: 16px;
  background: var(--surface);
}
.window-body.grid-view {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 8px; align-content: start;
}
.window-body .file-grid-item {
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 6px; border-radius: 8px; cursor: pointer;
  transition: all .12s ease; border: 2px solid transparent;
}
.window-body .file-grid-item:hover { background: rgba(124,92,255,.06); border-color: var(--brand-soft); }
.window-body .file-grid-item span { font-size: 11px; color: #3a3a50; text-align: center; margin-top: 4px; }

/* ========== Text Viewer ========== */
.text-viewer {
  font-size: 14px; line-height: 1.8; color: var(--text);
  white-space: pre-wrap; font-family: var(--font);
  padding: 4px;
}
.text-viewer .highlight { background: #fff3cd; padding: 2px 6px; border-radius: 3px; font-weight: 600; }

/* ========== Image Viewer ========== */
.image-viewer {
  display: flex; align-items: center; justify-content: center;
  min-height: 200px; background: #f8f8fc; border-radius: 6px;
}
.image-viewer svg { max-width: 100%; max-height: 300px; }
.broken-image {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 200px; color: var(--text-muted);
  gap: 8px;
}
.broken-image .icon { font-size: 48px; opacity: .5; }
.broken-image .msg { font-size: 13px; }

/* ========== Zip Password ========== */
.zip-password {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 160px; gap: 14px;
}
.zip-password .zip-icon { opacity: .7; }
.zip-password .zip-label { font-size: 14px; color: var(--text); font-weight: 600; }
.zip-password .zip-hint { font-size: 12px; color: var(--text-muted); }
.zip-password input {
  padding: 10px 16px; border: 2px solid var(--border); border-radius: 8px;
  font-size: 14px; width: 200px; text-align: center; font-family: var(--font);
  outline: none; transition: border-color .2s;
}
.zip-password input:focus { border-color: var(--brand); }
.zip-password button {
  padding: 10px 28px; background: var(--brand); color: #fff;
  border: none; border-radius: 8px; font-size: 14px; cursor: pointer;
  font-family: var(--font); transition: all .15s;
}
.zip-password button:hover { background: #6a48e8; transform: translateY(-1px); }
.zip-password .error { color: var(--red); font-size: 12px; }

/* ========== Recycle Bin ========== */
.recycle-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-radius: 8px; background: var(--surface-muted);
  margin-bottom: 6px;
}
.recycle-item .r-name { font-size: 13px; color: var(--text); }
.recycle-item .r-meta { font-size: 11px; color: var(--text-muted); }
.recycle-restore-btn {
  padding: 4px 14px; background: var(--teal); color: #fff;
  border: none; border-radius: 6px; font-size: 12px; cursor: pointer;
  font-family: var(--font); transition: all .15s;
}
.recycle-restore-btn:hover { background: #4ab89d; }
.recycle-empty { text-align: center; color: var(--text-dim); font-size: 13px; padding: 30px; }

/* ========== Context Menu ========== */
#context-menu {
  position: fixed; z-index: 2000; min-width: 180px;
  background: rgba(255,255,255,.96); backdrop-filter: blur(16px);
  border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow-lg); padding: 6px 0;
  display: none; opacity: 0; transform: scale(.95);
  transition: opacity .12s, transform .12s;
}
#context-menu.show { display: block; opacity: 1; transform: scale(1); }
.ctx-item {
  padding: 8px 16px; font-size: 13px; color: var(--text);
  cursor: pointer; display: flex; align-items: center; gap: 8px;
  transition: background .1s;
}
.ctx-item:hover { background: var(--brand-soft); color: var(--brand); }
.ctx-item.disabled { color: var(--text-dim); pointer-events: none; }
.ctx-divider { height: 1px; background: var(--border); margin: 4px 0; }

/* ========== Modal Overlay ========== */
#modal-overlay {
  position: fixed; inset: 0; z-index: 3000;
  background: rgba(0,0,0,.45); display: none;
  align-items: center; justify-content: center;
}
#modal-overlay.show { display: flex; }
.modal {
  background: var(--surface); border-radius: 14px;
  padding: 28px; min-width: 360px; max-width: 480px;
  box-shadow: var(--shadow-lg); animation: modal-in .25s ease;
}
@keyframes modal-in { from { opacity: 0; transform: translateY(20px) scale(.96); } }
.modal h3 { font-size: 16px; color: var(--text); margin-bottom: 16px; }
.modal-table { width: 100%; border-collapse: collapse; }
.modal-table td { padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--border); }
.modal-table td:first-child { color: var(--text-muted); width: 80px; }
.modal-table td:last-child { color: var(--text); font-weight: 500; }
.modal-input {
  width: 100%; padding: 10px 14px; border: 2px solid var(--border);
  border-radius: 8px; font-size: 14px; font-family: var(--font);
  outline: none; margin-bottom: 14px;
}
.modal-input:focus { border-color: var(--brand); }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
.modal-btn {
  padding: 8px 20px; border-radius: 8px; font-size: 13px; cursor: pointer;
  font-family: var(--font); border: none; transition: all .15s;
}
.modal-btn.primary { background: var(--brand); color: #fff; }
.modal-btn.primary:hover { background: #6a48e8; }
.modal-btn.secondary { background: var(--surface-muted); color: var(--text); }
.modal-btn.secondary:hover { background: #e8e8f0; }

/* ========== Win Screen ========== */
.win-screen {
  text-align: center; padding: 20px 0;
}
.win-screen .trophy { font-size: 64px; margin-bottom: 12px; }
.win-screen h2 { font-size: 22px; color: var(--brand); margin-bottom: 8px; }
.win-screen .tracking {
  font-size: 28px; font-weight: 700; color: var(--amber-deep);
  letter-spacing: 2px; padding: 12px 24px; background: #fff8e8;
  border-radius: 10px; display: inline-block; margin: 16px 0;
  border: 2px dashed var(--amber);
}
.win-screen p { font-size: 14px; color: var(--text-muted); line-height: 1.6; }

/* ========== Settings Toggle ========== */
.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.settings-row span { font-size: 14px; color: var(--text); }
.toggle-switch {
  width: 44px; height: 24px; background: #d0d0d8; border-radius: 12px;
  cursor: pointer; position: relative; transition: background .2s;
}
.toggle-switch.on { background: var(--brand); }
.toggle-switch::after {
  content: ''; position: absolute; width: 20px; height: 20px;
  background: #fff; border-radius: 50%; top: 2px; left: 2px;
  transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.15);
}
.toggle-switch.on::after { transform: translateX(20px); }

/* ========== New File Pop ========== */
@keyframes pop-in {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.desk-icon.pop-in { animation: pop-in .4s ease forwards; }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

/* ========== Responsive ========== */
@media (max-width: 600px) {
  .window { min-width: 260px; }
  .desk-icon { width: 68px; padding: 8px 4px 6px; }
  .desk-icon svg { transform: scale(.85); }
}
</style>
</head>

  <div class="lock-time" id="lock-time">09:41</div>
  <div class="lock-date" id="lock-date">7月30日 星期三</div>
  <div class="lock-avatar"><img src="avatar.png" alt="花哞" style="width:90px;height:90px;border-radius:50%;object-fit:cover;"></div>

  <div class="lock-form">
    <input type="text" class="lock-input" id="lock-user" placeholder="用户名" autocomplete="off" value="花哞">

<div id="desktop">

<div id="taskbar"></div>
<div id="context-menu"></div>
<div id="modal-overlay"></div>

// ============ Game State ============
const STATE = {
  windows: {},
  openWindowIds: [],
  windowZIndex: 100,
  showHidden: false,
  zipUnlocked: false,
  extractedFiles: [],
  restoredFiles: [],
  dragging: null,
  dragOffset: { x: 0, y: 0 },
  contextTarget: null,
  gameCompleted: false
};

// ============ DOM Refs ============
const $desktop = document.getElementById('desktop');
const $desktopIcons = document.getElementById('desktop-icons');
const $taskbar = document.getElementById('taskbar');
const $contextMenu = document.getElementById('context-menu');
const $modalOverlay = document.getElementById('modal-overlay');

// ============ Helpers ============
function getFile(id) {
  for (const key of Object.keys(FILE_SYSTEM)) {
    const item = FILE_SYSTEM[key];
    if (item.id === id) return item;
    if (item.children && item.children[id]) return item.children[id];
    if (item.deletedFiles) {
      const df = item.deletedFiles.find(f => f.id === id);
      if (df) return df;
    }
    if (item.extractFiles) {
      const ef = item.extractFiles.find(f => f.id === id);
      if (ef) return ef;
    }
  }
  for (const f of STATE.extractedFiles) {
    if (f.id === id) return f;
  }
  return null;
}

function getFileParent(id) {
  for (const key of Object.keys(FILE_SYSTEM)) {
    const item = FILE_SYSTEM[key];
    if (item.children && item.children[id]) return item;
    if (item.deletedFiles && item.deletedFiles.find(f => f.id === id)) return item;
    if (item.extractFiles && item.extractFiles.find(f => f.id === id)) return item;
  }
  return null;
}

function isDesktopFile(id) {
  return FILE_SYSTEM.hasOwnProperty(id) || STATE.extractedFiles.some(f => f.id === id);
}

function getAllDesktopFiles() {
  const files = [];
  for (const key of Object.keys(FILE_SYSTEM)) {
    const item = FILE_SYSTEM[key];
    if (item.hidden && !STATE.showHidden) continue;
    files.push(item);
  }
  files.push(...STATE.extractedFiles);
  return files;
}

// ============ Desktop Rendering ============
function renderDesktopIcons() {
  $desktopIcons.innerHTML = '';
  const files = getAllDesktopFiles();
  const ICON_HEIGHT = 84;
  const COLUMN_WIDTH = 90;
  const TOP_MARGIN = 16;
  const LEFT_MARGIN = 16;
  const desktopHeight = window.innerHeight - 48; // minus taskbar
  const iconsPerColumn = Math.floor((desktopHeight - TOP_MARGIN - 16) / ICON_HEIGHT);
  let col = 0;
  let row = 0;
  files.forEach(file => {
    if (row >= iconsPerColumn) {
      col++;
      row = 0;
    }
    const el = document.createElement('div');
    el.className = 'desk-icon';
    let iconHtml = ICONS[file.icon] ? ICONS[file.icon]() : ICONS.folder();
    if (file.id === 'file-zip' && !file.unlocked) {
      el.classList.add('locked');
    }
    if (file.hidden) {
      el.classList.add('hidden-file');
      if (STATE.showHidden) el.classList.add('visible');
    }
    el.innerHTML = iconHtml + `<span class="label">${file.name}</span>`;
    el.dataset.fileId = file.id;
    el.addEventListener('dblclick', () => openFile(file.id));
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      selectIcon(el);
    });
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      STATE.contextTarget = file.id;
      showContextMenu(e.clientX, e.clientY, file.id);
    });
    el.style.position = 'absolute';
    el.style.left = (LEFT_MARGIN + col * COLUMN_WIDTH) + 'px';
    el.style.top = (TOP_MARGIN + row * ICON_HEIGHT) + 'px';
    $desktopIcons.appendChild(el);
    row++;
  });
}

function selectIcon(el) {
  document.querySelectorAll('.desk-icon.selected').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
}

// ============ Window Management ============
function createWindow(fileId, title, x, y) {
  if (STATE.windows[fileId]) {
    focusWindow(fileId);
    return;
  }

  const win = document.createElement('div');
  win.className = 'window focused';
  win.dataset.fileId = fileId;
  win.style.left = x + 'px';
  win.style.top = y + 'px';
  win.style.zIndex = ++STATE.windowZIndex;

  // Titlebar
  const titlebar = document.createElement('div');
  titlebar.className = 'window-titlebar';
  titlebar.innerHTML = `
    <div class="window-dots">
      <div class="window-dot win-close" data-action="close"></div>
      <div class="window-dot win-min" data-action="minimize"></div>
      <div class="window-dot win-max"></div>
    </div>
    <span class="window-title">${title}</span>
    <div class="win-close-x" data-action="close" title="关闭">&#10005;</div>
  `;
  win.appendChild(titlebar);

  // Body
  const body = document.createElement('div');
  body.className = 'window-body';
  win.appendChild(body);

  $desktop.appendChild(win);

  STATE.windows[fileId] = { el: win, x, y, body };
  STATE.openWindowIds.push(fileId);

  // Titlebar events
  titlebar.addEventListener('mousedown', (e) => startDrag(e, fileId));
  titlebar.querySelector('.win-close').addEventListener('click', (e) => { e.stopPropagation(); closeWindow(fileId); });
  titlebar.querySelector('.win-close-x').addEventListener('click', (e) => { e.stopPropagation(); closeWindow(fileId); });
  titlebar.querySelector('.win-min').addEventListener('click', (e) => { e.stopPropagation(); minimizeWindow(fileId); });

  win.addEventListener('mousedown', () => focusWindow(fileId));

  renderWindowContent(fileId);
  updateTaskbar();
  return win;
}

function focusWindow(fileId) {
  const w = STATE.windows[fileId];
  if (!w) return;
  w.el.style.zIndex = ++STATE.windowZIndex;
  document.querySelectorAll('.window.focused').forEach(el => el.classList.remove('focused'));
  w.el.classList.add('focused');
  updateTaskbar();
}

function closeWindow(fileId) {
  const w = STATE.windows[fileId];
  if (!w) return;
  w.el.remove();
  delete STATE.windows[fileId];
  STATE.openWindowIds = STATE.openWindowIds.filter(id => id !== fileId);
  updateTaskbar();
}

function minimizeWindow(fileId) {
  const w = STATE.windows[fileId];
  if (!w) return;
  w.el.style.display = 'none';
  updateTaskbar();
}

function restoreWindow(fileId) {
  const w = STATE.windows[fileId];
  if (!w) return;
  w.el.style.display = 'flex';
  focusWindow(fileId);
}

function startDrag(e, fileId) {
  if (e.target.classList.contains('window-dot')) return;
  const w = STATE.windows[fileId];
  if (!w) return;
  STATE.dragging = fileId;
  STATE.dragOffset = { x: e.clientX - w.x, y: e.clientY - w.y };
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', stopDrag);
}

function onDrag(e) {
  if (!STATE.dragging) return;
  const w = STATE.windows[STATE.dragging];
  if (!w) return;
  w.x = e.clientX - STATE.dragOffset.x;
  w.y = e.clientY - STATE.dragOffset.y;
  w.el.style.left = w.x + 'px';
  w.el.style.top = w.y + 'px';
}

function stopDrag() {
  STATE.dragging = null;
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', stopDrag);
}

function updateTaskbar() {
  $taskbar.innerHTML = '';
  const openIds = STATE.openWindowIds.filter(id => STATE.windows[id] && STATE.windows[id].el.style.display !== 'none');
  openIds.forEach(id => {
    const f = getFile(id);
    if (!f) return;
    const item = document.createElement('div');
    item.className = 'taskbar-item';
    const isFocused = STATE.windows[id] && STATE.windows[id].el.classList.contains('focused');
    if (isFocused) item.classList.add('active');
    item.innerHTML = `<span class="taskbar-dot"></span>${f.name}`;
    item.addEventListener('click', () => {
      const w = STATE.windows[id];
      if (w && w.el.style.display === 'none') {
        restoreWindow(id);
      } else {
        focusWindow(id);
      }
    });
    $taskbar.appendChild(item);
  });
  // Hint
  const hint = document.createElement('span');
  hint.className = 'taskbar-hint';
  hint.textContent = STATE.gameCompleted ? '谜题已解开！' : '';
  $taskbar.appendChild(hint);
}

// ============ Window Content ============
function renderWindowContent(fileId) {
  const w = STATE.windows[fileId];
  if (!w) return;
  const file = getFile(fileId);
  if (!file) return;
  const body = w.body;
  body.innerHTML = '';

  switch (file.type) {
    case 'folder':
      body.classList.add('grid-view');
      const children = file.children || {};
      Object.values(children).forEach(child => {
        if (child.hidden && !STATE.showHidden) return;
        const item = document.createElement('div');
        item.className = 'file-grid-item';
        let iconFn = ICONS[child.icon] || ICONS.txt;
        item.innerHTML = iconFn(34, 40) + `<span>${child.name}</span>`;
        item.addEventListener('dblclick', () => openFile(child.id));
        item.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();
          STATE.contextTarget = child.id;
          showContextMenu(e.clientX, e.clientY, child.id);
        });
        body.appendChild(item);
      });
      break;

    case 'text':
      body.classList.remove('grid-view');
      if (file.content) {
        const tv = document.createElement('div');
        tv.className = 'text-viewer';
        tv.textContent = file.content;
        body.appendChild(tv);
      } else {
        // Damaged file - no text content
        const broken = document.createElement('div');
        broken.className = 'broken-image';
        broken.innerHTML = `
          <div class="icon">📄❌</div>
          <div class="msg">无法打开此文件</div>
          <div class="msg" style="font-size:11px;color:#aaa;">文件可能已损坏或格式不正确</div>
        `;
        body.appendChild(broken);
      }
      break;

    case 'image':
      body.classList.remove('grid-view');
      if (file.realType === 'text' && !file.imageSrc) {
        // Wrong extension - show broken image
        const broken = document.createElement('div');
        broken.className = 'broken-image';
        broken.innerHTML = `
          <div class="icon">🖼️❌</div>
          <div class="msg">无法打开此文件</div>
          <div class="msg" style="font-size:11px;color:#aaa;">文件可能已损坏或格式不正确</div>
        `;
        body.appendChild(broken);
      } else if (file.imageSrc) {
        const iv = document.createElement('div');
        iv.className = 'image-viewer';
        iv.innerHTML = `<img src="${file.imageSrc}" style="max-width:100%;max-height:300px;border-radius:6px;" alt="${file.name}">`;
        body.appendChild(iv);
      } else if (file.imageContent) {
        const iv = document.createElement('div');
        iv.className = 'image-viewer';
        iv.innerHTML = file.imageContent;
        body.appendChild(iv);
      } else {
        // No image content available - damaged
        const broken = document.createElement('div');
        broken.className = 'broken-image';
        broken.innerHTML = `
          <div class="icon">🖼️❌</div>
          <div class="msg">无法打开此文件</div>
          <div class="msg" style="font-size:11px;color:#aaa;">文件可能已损坏或格式不正确</div>
        `;
        body.appendChild(broken);
      }
      break;

    case 'zip':
      body.classList.remove('grid-view');
      if (file.unlocked) {
        // Show extracted files
        body.classList.add('grid-view');
        file.extractFiles.forEach(ef => {
          const item = document.createElement('div');
          item.className = 'file-grid-item';
          let iconFn = ICONS[ef.icon] || ICONS.txt;
          item.innerHTML = iconFn(34, 40) + `<span>${ef.name}</span>`;
          item.addEventListener('dblclick', () => openFile(ef.id));
          item.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
            STATE.contextTarget = ef.id;
            showContextMenu(e.clientX, e.clientY, ef.id);
          });
          body.appendChild(item);
        });
      } else {
        // Show password input
        const zp = document.createElement('div');
        zp.className = 'zip-password';
        zp.innerHTML = `
          <div class="zip-icon">${ICONS.zipBig ? ICONS.zipBig() : ICONS.zip(48,56)}</div>
          <div class="zip-label">此文件已加密</div>
          <div class="zip-hint">提示：合照的作者</div>
          <input type="text" id="zip-password-input" placeholder="输入密码..." autocomplete="off">
          <button id="zip-unlock-btn">解压</button>
          <div class="error" id="zip-error"></div>
        `;
        body.appendChild(zp);

        setTimeout(() => {
          const input = document.getElementById('zip-password-input');
          const btn = document.getElementById('zip-unlock-btn');
          const err = document.getElementById('zip-error');
          if (!input || !btn) return;

          const tryUnlock = () => {
            const pwd = input.value.trim();
            if (pwd === file.password) {
              file.unlocked = true;
              STATE.zipUnlocked = true;
              renderWindowContent(fileId);
              updateTaskbar();
            } else {
              err.textContent = '密码错误，请重试';
              input.value = '';
              input.focus();
            }
          };

          btn.addEventListener('click', tryUnlock);
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') tryUnlock();
          });
        }, 50);
      }
      break;

    case 'html':
      body.classList.remove('grid-view');
      const notFound = document.createElement('div');
      notFound.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:12px;';
      notFound.innerHTML = `
        <div style="font-size:72px;font-weight:700;color:#d0d0d8;font-family:monospace;">404</div>
        <div style="font-size:16px;color:#6a6a7e;">Not Found</div>
        <div style="font-size:12px;color:#9a9ab0;margin-top:8px;">请求的资源在服务器上未找到</div>
      `;
      body.appendChild(notFound);
      break;

    case 'recycle':
      body.classList.remove('grid-view');
      if (file.deletedFiles && file.deletedFiles.length > 0 && !STATE.restoredFiles.includes(file.deletedFiles[0].id)) {
        file.deletedFiles.forEach(df => {
          const item = document.createElement('div');
          item.className = 'recycle-item';
          item.innerHTML = `
            <div>
              <div class="r-name">${df.name}</div>
              <div class="r-meta">删除时间: ${df.modified || '未知'} | 类型: 文本文档</div>
            </div>
            <button class="recycle-restore-btn">还原</button>
          `;
          item.querySelector('.recycle-restore-btn').addEventListener('click', () => {
            restoreFromRecycle(df.id);
          });
          body.appendChild(item);
        });
      } else {
        const empty = document.createElement('div');
        empty.className = 'recycle-empty';
        empty.textContent = '回收站已清空';
        body.appendChild(empty);
      }
      break;

    case 'damaged':
      body.classList.remove('grid-view');
      const dmgBroken = document.createElement('div');
      dmgBroken.className = 'broken-image';
      dmgBroken.innerHTML = `
        <div class="icon">📄❌</div>
        <div class="msg">无法打开此文件</div>
        <div class="msg" style="font-size:11px;color:#aaa;">文件已损坏或格式不正确</div>
      `;
      body.appendChild(dmgBroken);
      break;

    default:
      body.classList.remove('grid-view');
      body.innerHTML = '<div style="padding:20px;color:#999;">无法打开此文件类型</div>';
  }
}

function restoreFromRecycle(fileId) {
  const file = getFile(fileId);
  if (!file) return;
  STATE.restoredFiles.push(fileId);
  // Remove from recycle bin's deleted files
  const recycle = FILE_SYSTEM['file-recycle'];
  if (recycle && recycle.deletedFiles) {
    recycle.deletedFiles = recycle.deletedFiles.filter(f => f.id !== fileId);
  }
  // Add to desktop
  STATE.extractedFiles.push(file);
  renderDesktopIcons();
  // Re-render recycle window if open
  if (STATE.windows['file-recycle']) {
    renderWindowContent('file-recycle');
  }
  // New file pop animation
  setTimeout(() => {
    const icons = $desktopIcons.querySelectorAll('.desk-icon');
    icons.forEach(icon => {
      if (icon.dataset.fileId === fileId) icon.classList.add('pop-in');
    });
  }, 100);
  updateTaskbar();
}

// ============ File Operations ============
function openFile(fileId) {
  const file = getFile(fileId);
  if (!file) return;

  // If it's a folder or recycle, open in a window
  if (file.type === 'folder' || file.type === 'recycle' || file.type === 'zip') {
    const existing = STATE.windows[fileId];
    if (existing) {
      if (existing.el.style.display === 'none') {
        restoreWindow(fileId);
      } else {
        focusWindow(fileId);
      }
      return;
    }
    const x = 120 + Object.keys(STATE.windows).length * 30;
    const y = 40 + Object.keys(STATE.windows).length * 30;
    createWindow(fileId, file.name, x, y);
    return;
  }

  // Text or image - open in a window
  const existing = STATE.windows[fileId];
  if (existing) {
    if (existing.el.style.display === 'none') {
      restoreWindow(fileId);
    } else {
      focusWindow(fileId);
    }
    return;
  }
  const x = 120 + Object.keys(STATE.windows).length * 30;
  const y = 40 + Object.keys(STATE.windows).length * 30;
  const win = createWindow(fileId, file.name, x, y);

  // No win screen popup
}

// ============ Context Menu ============
function showContextMenu(x, y, fileId) {
  $contextMenu.innerHTML = '';
  $contextMenu.style.left = x + 'px';
  $contextMenu.style.top = y + 'px';

  const file = fileId ? getFile(fileId) : null;

  if (file) {
    // File context menu
    addCtxItem('打开', () => openFile(fileId));
    addCtxDivider();
    addCtxItem('属性', () => showProperties(fileId));
    addCtxItem('重命名', () => showRename(fileId));
    if (file.type === 'text' || file.realType === 'text' || file.type === 'damaged') {
      addCtxDivider();
      addCtxItem('删除', () => deleteFile(fileId));
    }
  } else {
    // Desktop context menu
    addCtxItem('刷新', () => { renderDesktopIcons(); });
    addCtxDivider();
    addCtxItem(
      STATE.showHidden ? '隐藏隐藏文件' : '显示隐藏文件',
      () => toggleHiddenFiles()
    );
  }

  $contextMenu.classList.add('show');
  setTimeout(() => document.addEventListener('click', hideContextMenu, { once: true }), 0);
}

function addCtxItem(label, action) {
  const item = document.createElement('div');
  item.className = 'ctx-item';
  item.textContent = label;
  item.addEventListener('click', (e) => {
    e.stopPropagation();
    hideContextMenu();
    action();
  });
  $contextMenu.appendChild(item);
}

function addCtxDivider() {
  const div = document.createElement('div');
  div.className = 'ctx-divider';
  $contextMenu.appendChild(div);
}

function hideContextMenu() {
  $contextMenu.classList.remove('show');
}

function toggleHiddenFiles() {
  STATE.showHidden = !STATE.showHidden;
  renderDesktopIcons();
  // Refresh open folder windows
  Object.keys(STATE.windows).forEach(id => {
    const file = getFile(id);
    if (file && (file.type === 'folder' || file.type === 'recycle')) {
      renderWindowContent(id);
    }
  });
  updateTaskbar();
}

function deleteFile(fileId) {
  const file = getFile(fileId);
  if (!file) return;
  // Move to recycle bin
  const recycle = FILE_SYSTEM['file-recycle'];
  if (!recycle.deletedFiles) recycle.deletedFiles = [];
  recycle.deletedFiles.push(file);

  // Remove from desktop
  if (isDesktopFile(fileId)) {
    STATE.extractedFiles = STATE.extractedFiles.filter(f => f.id !== fileId);
  }
  // Close window if open
  closeWindow(fileId);
  renderDesktopIcons();
  updateTaskbar();
}

// ============ Modals ============
function showProperties(fileId) {
  const file = getFile(fileId);
  if (!file) return;

  const ext = file.name.includes('.') ? file.name.split('.').pop().toUpperCase() + ' 文件' : '文件夹';
  let rows = `
    <tr><td>文件名</td><td>${file.name}</td></tr>
    <tr><td>类型</td><td>${ext}</td></tr>
    <tr><td>修改日期</td><td>${file.modified || '未知'}</td></tr>
  `;
  if (file.author) {
    rows += `<tr><td>作者</td><td>${file.author}</td></tr>`;
  }
  if (file.captureDate) {
    rows += `<tr><td>拍摄日期</td><td>${file.captureDate}</td></tr>`;
  }

  $modalOverlay.innerHTML = `
    <div class="modal">
      <h3>${file.name} - 属性</h3>
      <table class="modal-table">${rows}</table>
      <div class="modal-btns" style="margin-top:16px;">
        <button class="modal-btn primary close-modal">确定</button>
      </div>
    </div>
  `;
  $modalOverlay.classList.add('show');
  $modalOverlay.querySelector('.close-modal').addEventListener('click', hideModal);
  $modalOverlay.addEventListener('click', (e) => { if (e.target === $modalOverlay) hideModal(); });
}

function showRename(fileId) {
  const file = getFile(fileId);
  if (!file) return;

  $modalOverlay.innerHTML = `
    <div class="modal">
      <h3>重命名文件</h3>
      <input class="modal-input" id="rename-input" value="${file.name}" autocomplete="off">
      <div class="modal-btns">
        <button class="modal-btn secondary close-modal">取消</button>
        <button class="modal-btn primary" id="rename-confirm">确定</button>
      </div>
    </div>
  `;
  $modalOverlay.classList.add('show');
  $modalOverlay.querySelector('.close-modal').addEventListener('click', hideModal);
  $modalOverlay.querySelector('#rename-confirm').addEventListener('click', () => {
    const newName = document.getElementById('rename-input').value.trim();
    if (newName && newName !== file.name) {
      // Track original content type if not already tracked
      if (!file.originalType) {
        file.originalType = file.type;
        if (file.content && !file.hiddenTextContent && !file.renamedContent) {
          file.originalTextContent = file.content;
        }
      }
      file.name = newName;
      // Update icon and type based on extension
      if (newName.endsWith('.txt')) {
        file.icon = 'txt';
        file.type = 'text';
        // If image has hidden text content, switching to .txt reveals it
        if (file.hiddenTextContent) {
          file.content = file.hiddenTextContent;
        } else if (file.realType === 'text' && file.originalTextContent) {
          file.content = file.originalTextContent;
        } else if (file.originalType === 'text' && file.originalTextContent) {
          // Was originally text, keep content
          file.content = file.originalTextContent;
        } else {
          // No text content available - mark as damaged
          file.content = null;
        }
      } else if (newName.endsWith('.png')) {
        file.icon = 'png';
        file.type = 'image';
        // Only non-damaged if it has image source
      } else if (newName.endsWith('.jpg') || newName.endsWith('.jpeg')) {
        file.icon = 'jpg';
        file.type = 'image';
      } else {
        // Unknown extension - file becomes damaged
        file.type = 'damaged';
      }
      // Refresh
      renderDesktopIcons();
      if (STATE.windows[fileId]) {
        STATE.windows[fileId].el.querySelector('.window-title').textContent = file.name;
        renderWindowContent(fileId);
      }
      // Also refresh parent folder window if this file is inside one
      const parent = getFileParent(fileId);
      if (parent && STATE.windows[parent.id]) {
        renderWindowContent(parent.id);
      }
      updateTaskbar();
    }
    hideModal();
  });
  $modalOverlay.addEventListener('click', (e) => { if (e.target === $modalOverlay) hideModal(); });
  setTimeout(() => document.getElementById('rename-input')?.select(), 100);
}

function hideModal() {
  $modalOverlay.classList.remove('show');
  $modalOverlay.innerHTML = '';
}

// ============ Global Events ============
$desktop.addEventListener('contextmenu', (e) => {
  // Only show desktop context menu if clicking on desktop (not on icons/windows)
  if (e.target === $desktop || e.target.id === 'desktop-icons') {
    e.preventDefault();
    STATE.contextTarget = null;
    showContextMenu(e.clientX, e.clientY, null);
  }
});

// Prevent browser context menu on desktop area
document.addEventListener('contextmenu', (e) => {
  if (e.target.closest('#desktop')) {
    e.preventDefault();
  }
});

// Close context menu on scroll
window.addEventListener('scroll', hideContextMenu);

// ============ Lock Screen ============
const LOCK_CREDENTIALS = {
  username: '花哞',
  password: '20190729'
};

function updateLockTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('lock-time').textContent = `${h}:${m}`;
}

function tryUnlock() {
  const user = document.getElementById('lock-user').value.trim();
  const pwd = document.getElementById('lock-pwd').value.trim();
  const err = document.getElementById('lock-error');

  if (user === LOCK_CREDENTIALS.username && pwd === LOCK_CREDENTIALS.password) {
    document.getElementById('lockscreen').classList.add('unlocked');
    setTimeout(() => {
      document.getElementById('lockscreen').style.display = 'none';
    }, 500);
  } else {
    err.classList.add('show');
    document.getElementById('lock-pwd').value = '';
    document.getElementById('lock-pwd').focus();
    // Shake animation
    const form = document.querySelector('.lock-form');
    form.style.animation = 'none';
    form.offsetHeight; // trigger reflow
    form.style.animation = 'shake .4s ease';
  }
}

function initLockScreen() {
  updateLockTime();
  setInterval(updateLockTime, 1000);

  document.getElementById('lock-btn').addEventListener('click', tryUnlock);
  document.getElementById('lock-pwd').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tryUnlock();
  });
  document.getElementById('lock-user').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('lock-pwd').focus();
  });
  setTimeout(() => document.getElementById('lock-pwd').focus(), 300);
}

function initGame() {
  renderDesktopIcons();
  updateTaskbar();
}
